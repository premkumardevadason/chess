# Chess Application Configuration
server.port=8081
spring.main.banner-mode=off
# spring.profiles.active=dev

chess.ai.openai=

# GPU/OpenCL Configuration for AMD GPU
# OpenCL memory cache size in MB (default: 2048)
chess.opencl.cache.max=2048
# Enable OpenCL validation (disable for better performance)
chess.opencl.validate=false
# Force OpenCL backend (auto-detect if not set)
# chess.opencl.force=true

# AI Systems Configuration (true=enabled, false=disabled)
chess.ai.qlearning.enabled=true
chess.ai.deeplearning.enabled=true
chess.ai.deeplearningcnn.enabled=true
chess.ai.dqn.enabled=true
chess.ai.mcts.enabled=true
chess.ai.alphazero.enabled=true
chess.ai.negamax.enabled=true
chess.ai.openai.enabled=true
chess.ai.leelazerochess.enabled=true
chess.ai.genetic.enabled=true
chess.ai.alphafold3.enabled=true
chess.ai.a3c.enabled=true

# Async I/O Configuration - Phase 5: Configuration-Driven Rollout
# Default false for safety - enable gradually
chess.async.enabled=true
chess.async.qlearning=true
chess.async.alphafold3=true
chess.async.dqn=true
chess.async.genetic=true
chess.async.alphazero=true
chess.async.leela=true
chess.async.mcts=true
chess.async.negamax=true
chess.async.deeplearning=true
chess.async.cnn=true

# AI State File Configuration
chess.ai.state.directory=state
chess.ai.qlearning.state.file=chess_qtable.dat.gz
chess.ai.deeplearning.state.file=chess_deeplearning_model.zip
chess.ai.deeplearningcnn.state.file=chess_cnn_model.zip
chess.ai.dqn.state.file=chess_dqn_model.zip
chess.ai.dqn.target.state.file=chess_dqn_target_model.zip
chess.ai.dqn.experiences.file=chess_dqn_experiences.dat
chess.ai.alphazero.state.file=alphazero_model.zip
chess.ai.alphazero.cache.file=alphazero_cache.dat
chess.ai.leelazerochess.policy=leela_policy.zip
chess.ai.leelazerochess.value=leela_value.zip
chess.ai.leelazerochess.games=leela_training_games.dat
chess.ai.genetic.state.file=ga_population.dat
chess.ai.genetic.generation.file=ga_generation.dat
chess.ai.alphafold3.state.file=alphafold3_state.dat
chess.ai.a3c.state.file=a3c_model.zip

# AI Gameplay Configuration
# Enable all AI systems to play against user (true) or single AI selection (false)
chess.ai.all.enabled=true

# JVM Performance Optimization
# Fix TieredCompilation conflict (remove -XX:TieredStopAtLevel=1 from JVM args)
chess.jvm.tiered.level=4
# Enable ND4J AVX optimizations
spring.jvm.args=-DND4J_IGNORE_AVX=false

# MCP Double Ratchet Encryption Configuration
# Enable/disable Double Ratchet encryption (default: false for safety)
mcp.encryption.enabled=true
mcp.encryption.algorithm=AES/GCM/NoPadding
mcp.encryption.key-size=256

# Backward compatibility with unencrypted clients
mcp.encryption.backward-compatible=true

# Session management
mcp.encryption.session-timeout-minutes=30

# Training data encryption
mcp.encryption.encrypt-training-data=true
mcp.encryption.encrypt-session-state=true

# Rate limiting adjustments for encryption overhead
mcp.encryption.encrypted-requests-per-minute=80
mcp.encryption.encrypted-moves-per-minute=50
mcp.encryption.encryption-overhead-factor=1.25

# Eye Tracking Configuration
chess.eyetracking.enabled=true
# Enable all eye-tracking services
chess.eyetracking.services.enabled=true
chess.eyetracking.default.webcam.on=false
chess.eyetracking.user.games.only=true
chess.eyetracking.disable.during.ai.training=true
chess.eyetracking.disable.on.game.reset=true
chess.eyetracking.camera.device=0
chess.eyetracking.fps=30
chess.eyetracking.prediction.confidence.threshold=0.7
chess.eyetracking.precomputation.timeout=2000ms

# Target Interface Configuration
chess.eyetracking.target.interface=thymeleaf
chess.eyetracking.target.url=http://localhost:8081
chess.eyetracking.board.template=thymeleaf_chess_board_template.png
chess.eyetracking.exclude.react=true

# Dynamic Board Detection (REQUIREMENT 1)
chess.eyetracking.board.detection.interval=500ms
chess.eyetracking.board.detection.accuracy=0.8
chess.eyetracking.board.position.tracking=true

# Eye-Tracking Tolerance Configuration
chess.eyetracking.tolerance.expansion.factor=0.15
chess.eyetracking.tolerance.nearest.distance=0.25
chess.eyetracking.tolerance.probability.threshold=0.20
chess.eyetracking.tolerance.calibration.enabled=true
chess.eyetracking.tolerance.adaptive.learning=true

# Square Highlighting (REQUIREMENTS 2 & 3)
chess.eyetracking.highlight.enabled=true
chess.eyetracking.highlight.color=blue
chess.eyetracking.highlight.duration=3000ms
chess.eyetracking.highlight.repeat.enabled=true

# Piece Intention Analysis (REQUIREMENT 4)
chess.eyetracking.intention.analysis.enabled=true
chess.eyetracking.intention.confidence.threshold=0.6
chess.eyetracking.intention.move.prediction.count=3

# Performance Settings
chess.eyetracking.threads=4
chess.eyetracking.gpu.enabled=true
chess.eyetracking.memory.limit=1GB

# Training Configuration - LSTM Optimized
chess.eyetracking.training.enabled=true
chess.eyetracking.training.method=LSTM_ATTENTION
chess.eyetracking.training.sequence.length=30
chess.eyetracking.training.batch.size=32
chess.eyetracking.training.learning.rate=0.001
chess.eyetracking.training.attention.heads=8
chess.eyetracking.training.lstm.units=128
chess.eyetracking.training.bidirectional=true

# Privacy Settings
chess.eyetracking.data.retention.days=7
chess.eyetracking.auto.delete=true
chess.eyetracking.consent.required=true
chess.eyetracking.encryption.enabled=true
chess.eyetracking.audit.logging=true
chess.eyetracking.gdpr.compliance=true
chess.eyetracking.data.anonymization=true

# Resource Management
chess.eyetracking.max.concurrent.ais=6
chess.eyetracking.cpu.usage.limit=0.8
chess.eyetracking.memory.usage.limit=0.85
chess.eyetracking.circuit.breaker.enabled=true

# Log4J Configuration
# Log4J2 configuration
logging.config=classpath:log4j2.xml