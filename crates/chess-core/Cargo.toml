[package]
name         = "chess-core"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
description  = "Pure-logic chess core: board, FIDE rules, move generation, SAN, game state machine"

[lib]
path = "src/lib.rs"

[dependencies]
smallvec  = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
anyhow     = { workspace = true }
# `cozy-chess` is used only as a cross-check oracle in `examples/compare_divide.rs`
# during movegen development. Removing this would break that example only.
cozy-chess = "0.3"
# `insta` is the snapshot-testing harness used by the move-list snapshot
# (T069). The `yaml` feature is not required; default features are fine.
insta      = "1"
criterion  = { workspace = true }

[[bench]]
name    = "movegen"
harness = false
