[package]
name         = "chess-engine"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
authors      = { workspace = true }
license      = { workspace = true }
description  = "Forked Carp 3.0.1: alpha-beta + iterative deepening + NNUE + transposition table + Lazy SMP"

[lib]
path = "src/lib.rs"

[dependencies]
chess-core        = { path = "../chess-core" }
chess             = { package = "chess-engine-chess", path = "../chess-engine-chess" }
carp              = { package = "chess-engine-carp",  path = "../chess-engine-carp"  }
crossbeam-channel = { workspace = true }
smallvec          = { workspace = true }
thiserror         = { workspace = true }
# Used to derive Serialize/Deserialize on the public configuration enums
# (StrengthPreset) so chess-app can persist them in settings.toml. The
# core search code itself does no I/O — see contracts/engine-api.md §3.5.
serde             = { workspace = true }

[features]
# When enabled, `tests/no_io.rs` performs a source-level audit that
# verifies the engine crate does not reference any `std::fs` or
# `std::net` APIs. Treated as panicking shims at the source level —
# any forbidden symbol causes the test to fail. See
# contracts/engine-api.md §3.5 and SC-007.
no-io-audit = []

[dev-dependencies]
anyhow = { workspace = true }
criterion = { workspace = true }

[[bench]]
name    = "nnue"
harness = false

[[bench]]
name    = "search"
harness = false
