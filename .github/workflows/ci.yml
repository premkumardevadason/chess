name: ci

on:
  push:
    branches: [main, "001-chess-ai-rewrite"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test-bench:
    name: Build / test / bench (Windows x86-64 MSVC)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo registry / target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          shared-key: ci-windows

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (release)
        run: cargo test --workspace --release --tests

      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

      - name: cargo build (release)
        run: cargo build --workspace --release

      - name: cargo build (release-static, MSVC, +crt-static)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static -D warnings"
        run: cargo release-static

      - name: Upload chess-ai.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess-ai-${{ github.sha }}
          path: target/x86_64-pc-windows-msvc/release-static/chess-ai.exe
          if-no-files-found: warn
